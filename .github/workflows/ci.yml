name: ci

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  sv-sim-lint:
    name: SV Sim & Lint (Verilator)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Run simulations
        run: make -j$(nproc) sim

      - name: Lint synthesis wrappers
        run: make lint_syn

  cocotb-matrix:
    name: Parameterized Matrix (cocotb + pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: pip install cocotb pytest

      - name: Run cocotb verification matrix
        run: make test PYTEST=pytest

  verible-style:
    name: SystemVerilog Style (Verible)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Verible
        run: |
          curl -fsSL https://github.com/chipsalliance/verible/releases/download/v0.0-4302-gc6b29d62/verible-v0.0-4302-gc6b29d62-linux-static-x86_64.tar.gz -o "$RUNNER_TEMP/verible.tar.gz"
          tar -xzf "$RUNNER_TEMP/verible.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/verible-v0.0-4302-gc6b29d62/bin" >> "$GITHUB_PATH"

      - name: Run Verible lint and format checks
        run: make lint_style

  yosys-synth:
    name: Open-Source Synthesis (sv2v + Yosys)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Yosys and sv2v
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys unzip
          curl -fsSL https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip -o "$RUNNER_TEMP/sv2v.zip"
          unzip -q "$RUNNER_TEMP/sv2v.zip" -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/sv2v-Linux/sv2v"
          echo "$RUNNER_TEMP/sv2v-Linux" >> "$GITHUB_PATH"

      - name: Run Yosys Xilinx synthesis checks
        run: make synth_yosys
